name: CI

# The README tiles under assets/press/ are generated by build_svg.py and
# committed, so this repo has two things worth checking on a PR: that the
# generator's tests still pass, and that its brand block still matches the
# shared source of truth.
#
# The SVGs themselves are deliberately NOT rebuilt-and-diffed here. Font
# subsetting is not byte-reproducible — the same input produces different
# base64 payloads run to run — so a byte comparison would fail constantly while
# proving nothing. Parity is verified by stripping the font payloads, which is
# what the migration to press did.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # The PRESS token block in build_svg.py is a GENERATED region owned by the
      # `press` skill (github.com/natejswenson/claude-skills). Fails if it was
      # hand-edited, or if the shared tokens moved without re-emitting here.
      #
      # Pinned to an exact version rather than @latest so a token change upstream
      # surfaces as a failing check to adopt deliberately. `press propagate`
      # bumps this pin and re-emits in the same PR when the brand moves.
      #   npx -y @natjswenson/press@0.6.1 emit --repo .
      - name: Brand tokens in sync (press)
        run: npx -y @natjswenson/press@0.6.1 check --repo .
